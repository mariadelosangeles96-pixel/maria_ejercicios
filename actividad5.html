<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinos</title>
</head>
<body>
    <script>
        let monedas = [];
        for(let i = 1; i < 5; i++){
            let pedir = Number(prompt("¿Cuántas monedas tienes?"));
            monedas.push(pedir);
        }

        let totalMonedas = 0;
        for (let i = 0; i < monedas.length; i++){
            totalMonedas += monedas[i];
        }
        console.log(totalMonedas);

        let intentos = [];
        for(let i = 0; i < 4; i++){
            let adivinar = Number(prompt("¿Cuántas monedas crees que hay en total?"));
            intentos.push(adivinar);
        }

        for(let i = 1; i < 5; i++){
            if(intentos[i] == totalMonedas){
                alert("Jugador " + i + " ha ganado la partida. ")
            }
        }
    </script>
</body>
</html>
