<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería</title>
</head>

<body>
    <script>
        alert("Gestión de Frutería.");

        const inventario = {
            "manzana": { stock: 10, precio: 2.50 },
            "platano": { stock: 15, precio: 1.80 },
            "naranja": { stock: 20, precio: 1.50 },
            "fresa": { stock: 5, precio: 4.00 },
            "pera": { stock: 8, precio: 2.20 }
        };

        const peticiones = 3;
        let frutasPedidas = "";
        let cantidad = 0;
        let total = 0;

        for (let i = 0; i < peticiones; i++) {
            let fruta = prompt("¿Qué fruta quieres?");
            if(!inventario[fruta]){
                alert("No tenemos de esa fruta.");
            } else if(frutasPedidas.includes(fruta)){
                alert("Ya has pedido esa fruta.");
            } else {
                cantidad = prompt("¿Cuántas piezas quieres?");
                if(cantidad > inventario[fruta].stock){
                    alert("No nos queda de esa fruta.")
                } else{
                    let coste = cantidad * inventario[fruta].precio;
                    total += coste;
                    inventario[fruta].stock -= cantidad;
                    frutasPedidas += fruta;
                    alert(cantidad + " " + fruta + " añadido.");
                }
            }
        }
        alert("Importe total: " + total + "€.");
    </script>
</body>

</html>
