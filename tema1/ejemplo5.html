<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let a = Number(prompt("Número a:"));
        let b = Number(prompt("Número b:"));
        let c = Number(prompt("Número c:"));
        let d = Number(prompt("Número d:"));
        let e = Number(prompt("Número e:"));

        let mayor = a;
        let posicion = 1

        if (b > mayor) {
            mayor = b;
            posicion = 2
        } //no else porque entonces el mayor sigue siendo a
        if (c > mayor) {
            mayor = c;
            posicion = 3
        }
        if (d > mayor) {
            mayor = d;
            posicion = 4
        }
        if (e > mayor) {
            mayor = e;
            posicion = 5
        }

        console.log("El mayor es " + mayor + ". Posición: " + posicion);
    </script>
</body>

</html>
