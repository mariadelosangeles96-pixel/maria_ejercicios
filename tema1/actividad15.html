<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasolinera</title>
</head>
<body>
    <script>
        let iva = 0.21;
        let precioLitroDiesel = 2;
        let precioLitroGasolina = 1.98;
        let precioLitroDiesel10 = 2.06;

        let agricola = 0.35;
        let cliente = 0.05;

        let tipo = prompt("¿Qué tipo de combustible quiere? (diesel/gasolina/diesel10)");
        let litros = Number(prompt("¿Cuántos litros quiere?"));

        let esAgricola = prompt("¿Combustible agrícola? (s/n)");
        let esCliente = prompt("¿Tiene tarjeta cliente? (s/n)");

        let precioBase = 0;

        if (tipo === "diesel"){
            precioBase = precioLitroDiesel;
        } else if (tipo === "gasolina"){
            precioBase = precioLitroGasolina;
        } else if (tipo === "diesel10"){
            precioBase = precioLitroDiesel10;
        } else {
            alert("El tipo de combustible introducido no es válido.")
        }

        let descuento = 0;

        if(esAgricola){
            descuento += agricola;
        }
        if(esCliente){
            descuento += cliente;
        }

        let precioFinalLitro = precioBase - descuento;

        let subtotal = precioFinalLitro * litros;

        let totalCobrar = subtotal + (subtotal * iva);

        alert("El total a cobrar con IVA incluido es de " + totalCobrar.toFixed(2) + "€.");
    </script>
</body>
</html>
