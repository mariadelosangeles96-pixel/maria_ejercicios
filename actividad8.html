<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordinograma</title>
</head>
<body>
    <script>
        let a = prompt("Dime el valor de a");
        let b = prompt("Dime el valor de b");

        if(a>b){
            alert("El mayor es a");
        } else if (a == b){
            alert("Son iguales");
        } else {
            alert("El mayor es b");
        }
    </script>
</body>
</html>
