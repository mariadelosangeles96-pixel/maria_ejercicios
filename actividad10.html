<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificación actividad 2</title>
</head>
<body>
    <script>
        let a = Number(prompt("Número a:"));
        let b = Number(prompt("Número b:"));
        if(b == a){
            alert("a y b son iguales")
        }
        let c = Number(prompt("Número c:"));
        if(c == b){
            alert("b y c son iguales");
        } else if (c == a){
            alert("a y c son iguales");
        }
        let d = Number(prompt("Número d:"));
        if(d == a){
            alert("a y d son iguales");
        } else if (d == b){
            alert("b y d son iguales");
        } else if (d == c){
            alert("c y d son iguales");
        }
        let e = Number(prompt("Número e:"));
        if(e == a){
            alert("a y e son iguales");
        } else if (e == b){
            alert("b y e son iguales");
        } else if (e == c){
            alert("c y e son iguales");
        } else if(e == d){
            alert("d y e son iguales")
        }

        let mayor = a;
        let posicion = 1

        if (b > mayor) {
            mayor = b;
            posicion = 2
        } 
        if (c > mayor) {
            mayor = c;
            posicion = 3
        }
        if (d > mayor) {
            mayor = d;
            posicion = 4
        }
        if (e > mayor) {
            mayor = e;
            posicion = 5
        }

        console.log("El mayor es " + mayor + ". Posición: " + posicion);
    </script>
</body>
</html>
